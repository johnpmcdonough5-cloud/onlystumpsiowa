name: Daily blog post

# Publishes one pre-written post from blogbot/queue/ each morning.
# No API key and no dependencies — standard-library Python only.
#
# Cron is UTC and does not shift for daylight saving, so this lands an hour
# earlier in local terms once Iowa goes back to standard time. GitHub also runs
# scheduled jobs best-effort, so a late start is normal and harmless here.
on:
  schedule:
    - cron: "10 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: publish
        options: [publish, dry-run, self-test, status]

permissions:
  contents: write

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run
        run: |
          case "${{ inputs.mode || 'publish' }}" in
            dry-run)   python blogbot/publish.py --dry-run ;;
            self-test) python blogbot/publish.py --self-test ;;
            status)    python blogbot/publish.py --status ;;
            *)         python blogbot/publish.py ;;
          esac

      - name: Commit and push
        if: ${{ (inputs.mode || 'publish') == 'publish' }}
        run: |
          git config user.name "blogbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Daily blog post — $(TZ=America/Chicago date +%Y-%m-%d)"
            git push
          fi
